<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>协同办公群</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  html,body{height:100%;overflow:hidden}
  body{background:#0b0e16;color:#e7edf7;display:flex;flex-direction:column}

  /* ── 顶部导航(微信聊天页样式) ── */

  /* ── 成员条(微信群成员头像横排) ── */
  .member-bar{background:#141926;border-bottom:1px solid #232b3d;padding:8px 12px;
    display:flex;align-items:center;gap:10px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
  .member-bar::-webkit-scrollbar{display:none}
  .member-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
  .member-item .m-avatar{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:16px;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .member-item .m-name{font-size:10px;color:#8a94ad;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .member-item .m-dot{width:6px;height:6px;border-radius:50%;margin-top:1px}
  .member-item .m-dot.on{background:#07c160}
  .member-item .m-dot.off{background:#ccc}

  /* ── 消息区(微信群气泡) ── */
  #msgs{flex:1;overflow-y:auto;padding:12px 14px;background:#0b0e16}
  .time-sep{text-align:center;font-size:11px;color:#8a94ad;margin:10px 0;user-select:none}
  .msg{display:flex;margin-bottom:16px}
  .msg.mine{justify-content:flex-end}
  .msg .avatar{width:40px;height:40px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:16px;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .msg .body{max-width:65%;margin:0 10px;display:flex;flex-direction:column}
  .msg.mine .body{align-items:flex-end}
  .msg .who{font-size:11px;color:#8a94ad;margin-bottom:3px;padding:0 2px}
  .msg .bubble{position:relative;background:#1c2436;border:1px solid #232b3d;border-radius:6px;padding:9px 12px;
    font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;color:#e7edf7}
  .msg.mine .bubble{background:#3b6ef6}
  .msg .bubble::before{content:"";position:absolute;top:14px;left:-7px;border:5px solid transparent;
    border-right-color:#1c2436}
  .msg.mine .bubble::before{left:auto;right:-7px;border-right-color:transparent;border-left-color:#3b6ef6}
  .msg .time{font-size:10px;color:#6b7690;margin-top:2px;padding:0 2px}
  .msg.mine .time{text-align:right}

  /* 正在输入 */
  .typing{display:flex;margin-bottom:12px}
  .typing .avatar{width:40px;height:40px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:16px;font-weight:700;color:#fff}
  .typing .bubble{background:#1c2436;border:1px solid #232b3d;border-radius:6px;padding:10px 14px;margin-left:10px}
  .typing .bubble span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#8a94ad;
    margin:0 1.5px;animation:blink 1.2s infinite}
  .typing .bubble span:nth-child(2){animation-delay:.2s}
  .typing .bubble span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

  /* ── @ 角色候选面板 ── */
  .mention-panel{display:none;position:absolute;bottom:100%;left:10px;right:10px;max-height:200px;
    overflow-y:auto;background:#1c2436;border:1px solid #3b6ef6;border-radius:10px;padding:4px;z-index:30;
    box-shadow:0 -6px 20px rgba(0,0,0,.45)}
  .mention-panel.show{display:block}
  .mention-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
    font-size:13px;color:#e7edf7;cursor:pointer}
  .mention-item:hover{background:#232b3d}

  /* ── 输入栏(微信群底部) ── */
  .input-bar{background:#141926;border-top:1px solid #232b3d;padding:8px 10px;flex-shrink:0;
    display:flex;align-items:flex-end;gap:8px}
  .input-bar .plus{font-size:24px;color:#e7edf7;cursor:pointer;padding:0 4px 4px;user-select:none}
  .input-bar .voice-btn{font-size:20px;color:#e7edf7;cursor:pointer;padding:0 4px 4px;user-select:none;
    background:none;border:none;transition:transform .15s}
  .input-bar .voice-btn:hover{transform:scale(1.15)}
  .input-bar .voice-btn.rec{color:#e05a5a;animation:recPulse 1s infinite}
  @keyframes recPulse{50%{opacity:.4;transform:scale(1.2)}}
  .input-bar .voice-btn.muted{color:#6b7690}
  .voice-tip{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,25,38,.92);
    border:1px solid #3b6ef6;border-radius:12px;padding:14px 22px;font-size:14px;color:#e7edf7;
    display:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);text-align:center}
  .voice-tip.show{display:block}
  .voice-tip small{display:block;color:#8a94ad;font-size:11px;margin-top:6px}
  #chat-input{flex:1;background:#0e121b;border:1px solid #2a3450;border-radius:6px;padding:8px 12px;
    font-size:15px;outline:none;max-height:100px;min-height:36px;resize:none;line-height:1.4;color:#e7edf7}
  #chat-input:focus{border-color:#3b6ef6}
  #send-btn{background:#3b6ef6;color:#fff;border:none;border-radius:5px;padding:8px 16px;
    font-size:14px;cursor:pointer;font-weight:600;flex-shrink:0}
  #send-btn:active{background:#2f5bd6}
  #send-btn:disabled{background:#ccc}

  /* ── 成员列表弹层 ── */
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .drawer-mask.show{display:block}
  .drawer{position:fixed;top:0;bottom:0;right:-300px;width:280px;background:#141926;z-index:51;
    transition:right .25s ease;box-shadow:-4px 0 16px rgba(0,0,0,.15);display:flex;flex-direction:column}
  .drawer.show{right:0}
  .drawer .d-head{padding:14px 16px;font-size:15px;font-weight:600;border-bottom:1px solid #232b3d;
    display:flex;justify-content:space-between;align-items:center}
  .drawer .d-head .x{cursor:pointer;color:#8a94ad;font-size:18px}
  .drawer .d-list{flex:1;overflow-y:auto;padding:8px 0}
  .d-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer}
  .d-item:hover{background:#1c2436}
  .d-item .avatar{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;color:#fff}
  .d-item .d-info{display:flex;flex-direction:column}
  .d-item .d-name{font-size:14px;font-weight:500;color:#e7edf7}
  .d-item .d-role{font-size:11px;color:#8a94ad;margin-top:1px}
  .d-item .d-status{margin-left:auto;font-size:11px;color:#22b07d}
  .d-item .d-status.off{color:#6b7690}
</style>
</head>
<body>

<div class="member-bar" id="member-bar"></div>

<div id="msgs">
  <div class="time-sep">欢迎来到五 Agent 协同办公群</div>
</div>

<div class="mention-panel" id="mention-panel"></div>
<div class="input-bar">
  <button class="voice-btn" id="btn-voice" title="语音输入(说一句话自动发到群里)">🎤</button>
  <button class="voice-btn" id="btn-tts" title="自动朗读 Agent 消息(开关)">🔊</button>
  <textarea id="chat-input" rows="1" placeholder="发消息，4 个 Agent 都会回复"></textarea>
  <button id="send-btn">发送</button>
</div>
<div class="voice-tip" id="voice-tip"></div>

<!-- 成员列表弹层 -->
<div class="drawer-mask" id="drawer-mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="d-head">
    <span>群成员（5）</span>
    <span class="x" onclick="closeDrawer()">✕</span>
  </div>
  <div class="d-list" id="d-list"></div>
</div>

<script>
const GROUP_META = [
  { id:'yitai', name:'易总管', role:'调度 · 主管', color:'#ff7a59', letter:'管' },
  { id:'hermes', name:'爱马仕', role:'外部 · Hermes', color:'#3b6ef6', letter:'H' },
  { id:'claudecode', name:'ClaudeCode', role:'外部 · 开发', color:'#22b07d', letter:'C' },
  { id:'openhuma', name:'OpenHuman', role:'外部 · 编排', color:'#f5b731', letter:'O' },
  { id:'codex', name:'Codex', role:'外部 · 编码', color:'#8b5cf6', letter:'X' },
  { id:'me', name:'我', role:'群主', color:'#3b6ef6', letter:'我', me:true },
]
function meta(id){ return GROUP_META.find(m=>m.id===id) || { id, name:id, color:'#999', letter:String(id)[0].toUpperCase() } }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function fmt(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') }
function sepText(ts){ const d=new Date(ts); const now=new Date(); let s='';
  if(d.toDateString()===now.toDateString()) s='今天 ';
  else { const y=d.getFullYear(); s=(d.getMonth()+1)+'月'+d.getDate()+'日 '; }
  s += String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return s }
const escText = s => esc(s)

/* ── 渲染 ── */
let renderedKey = ''
function render() {
  fetch('/api/group-chat').then(r=>r.json()).then(d=>{
    const msgs = d.messages||[], busy = d.busy||[];
    const key = msgs.length+':'+busy.join(',');
    if (key===renderedKey) return;
    renderedKey = key;
    const box = document.getElementById('msgs');
    // 保留欢迎语
    box.innerHTML = '<div class="time-sep">欢迎来到五 Agent 协同办公群</div>';
    let lastDay = '';
    msgs.forEach(m=>{
      const day = new Date(m.ts).toDateString();
      if (day!==lastDay) { lastDay=day; const sep=document.createElement('div'); sep.className='time-sep';
        sep.textContent=sepText(m.ts); box.appendChild(sep); }
      const row=document.createElement('div');
      if (m.role==='user') {
        row.className='msg mine';
        row.innerHTML='<div class="body"><div class="bubble">'+escText(m.text)+'</div><div class="time">'+fmt(m.ts)+'</div></div>';
      } else {
        const mt=meta(m.sender);
        row.className='msg';
        row.innerHTML='<div class="avatar" style="background:'+mt.color+(mt.me?';color:#111':'')+'">'+esc(mt.letter)+'</div>'+
          '<div class="body"><div class="who">'+esc(mt.name)+'</div><div class="bubble">'+escText(m.text)+'</div><div class="time">'+fmt(m.ts)+'</div></div>';
        if (m.role !== 'user') {
          addSpeakBtn(row.querySelector('.time'), m.text);
          if (autoTTSOn) setTimeout(() => speak(m.text, mt.name), 400);
        }
      }
      box.appendChild(row);
    });
    // 正在输入
    busy.forEach(id=>{
      const mt=meta(id);
      const row=document.createElement('div');
      row.className='typing';
      row.innerHTML='<div class="avatar" style="background:'+mt.color+'">'+esc(mt.letter)+'</div>'+
        '<div class="bubble"><span></span><span></span><span></span></div>';
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  }).catch(()=>{});
}

/* ── 成员条 + 抽屉 ── */
function renderMembers(){
  const bar=document.getElementById('member-bar');
  bar.innerHTML='';
  GROUP_META.forEach(m=>{
    const it=document.createElement('div');
    it.className='member-item';
    it.title=m.name;
    it.innerHTML='<div class="m-avatar" style="background:'+m.color+(m.me?';color:#111':'')+'">'+esc(m.letter)+'</div>'+
      '<div class="m-name">'+esc(m.name)+'</div><div class="m-dot" id="dot-'+m.id+'"></div>';
    if (m.id==='me') { it.querySelector('.m-dot').className='m-dot on'; }
    else { it.style.cursor='pointer'; it.title='@'+m.name; it.onclick=()=>insertMention(m.name); }
    bar.appendChild(it);
  });
  // 抽屉
  const dl=document.getElementById('d-list');
  dl.innerHTML='';
  GROUP_META.forEach(m=>{
    const it=document.createElement('div');
    it.className='d-item';
    it.innerHTML='<div class="avatar" style="background:'+m.color+(m.me?';color:#111':'')+'">'+esc(m.letter)+'</div>'+
      '<div class="d-info"><span class="d-name">'+esc(m.name)+'</span><span class="d-role">'+esc(m.role)+'</span></div>'+
      '<span class="d-status" id="dst-'+m.id+'">…</span>';
    dl.appendChild(it);
  });
}
function refreshStatus(){
  fetch('/api/ext-agents').then(r=>r.json()).then(d=>{
    (d.agents||[]).forEach(a=>{
      const dot=document.getElementById('dot-'+a.id);
      if (dot) dot.className = 'm-dot '+(a.online?'on':'off');
      const st=document.getElementById('dst-'+a.id);
      if (st) { st.textContent = a.online?'在线':'离线'; st.className='d-status'+(a.online?'':' off'); }
    });
  }).catch(()=>{});
}
function openDrawer(){ document.getElementById('drawer').classList.add('show'); document.getElementById('drawer-mask').classList.add('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('show'); document.getElementById('drawer-mask').classList.remove('show'); }

/* ── @ 提及：点击成员/候选插入 ── */
function insertMention(name){
  const inp=document.getElementById('chat-input');
  const cur=inp.value;
  inp.value = cur ? cur + ' @'+name+' ' : '@'+name+' ';
  inp.focus();
  inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  document.getElementById('mention-panel').classList.remove('show');
}
function updateMention(){
  const inp=document.getElementById('chat-input');
  const panel=document.getElementById('mention-panel');
  const v=inp.value;
  const idx=v.lastIndexOf('@');
  if(idx>=0){
    const prefix=v.slice(idx+1).toLowerCase();
    const cands=GROUP_META.filter(m=>!m.me && (m.name.toLowerCase().includes(prefix)||m.id.toLowerCase().includes(prefix)));
    if(cands.length){
      panel.innerHTML='';
      cands.forEach(m=>{
        const it=document.createElement('div');
        it.className='mention-item';
        it.innerHTML='<span style="width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:'+m.color+'">'+esc(m.letter)+'</span>@'+esc(m.name);
        it.onclick=()=>{ inp.value=v.slice(0,idx)+'@'+m.name+' '; inp.focus(); panel.classList.remove('show'); };
        panel.appendChild(it);
      });
      panel.classList.add('show');
      return;
    }
  }
  panel.classList.remove('show');
}

/* ── 发送 ── */
function send(){
  const inp=document.getElementById('chat-input');
  const text=inp.value.trim();
  if(!text) return;
  inp.value=''; inp.style.height='auto';
  renderedKey='';
  fetch('/api/group-chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})})
    .then(()=>render()).catch(()=>{});
}
document.getElementById('send-btn').addEventListener('click',send);
document.getElementById('chat-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
}); document.getElementById('chat-input').addEventListener('keyup',e=>{ if(e.key==='Escape'){document.getElementById('mention-panel').classList.remove('show');} else updateMention(); });
document.getElementById('chat-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});

/* ================= 语音(基于 voice:ASR + TTS) ================= */
let voiceCfg = { tts_provider: 'browser', asr_provider: 'browser', autoTTS: false };
let autoTTSOn = false;
function loadVoiceCfg() {
  fetch('/api/voice-config').then(r => r.json()).then(d => {
    if (d && d.tts_provider) voiceCfg.tts_provider = d.tts_provider;
    if (d && d.asr_provider) voiceCfg.asr_provider = d.asr_provider;
    const ttsBtn = document.getElementById('btn-tts');
    if (ttsBtn && d && d.tts_provider !== 'browser') { ttsBtn.classList.remove('muted'); ttsBtn.title = 'TTS: ' + d.tts_provider + '(已配置 API)'; }
  }).catch(() => {});
}
loadVoiceCfg();

/* ── TTS 合成:浏览器内置优先,配置了 API 走 /api/tts ── */
function speak(text, name) {
  if (!text) return;
  const clean = String(text).replace(/[\*#_`>~\[\]]/g, '').slice(0, 500);
  if (voiceCfg.tts_provider !== 'browser') {
    fetch('/api/tts', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: clean, provider: voiceCfg.tts_provider }),
    }).then(r => {
      if (!r.ok) throw new Error('TTS ' + r.status);
      return r.blob();
    }).then(blob => {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.play();
      audio.onended = () => URL.revokeObjectURL(url);
    }).catch(e => {
      console.warn('API TTS 失败,回退浏览器语音:', e);
      browserSpeak(clean);
    });
  } else {
    browserSpeak(clean);
  }
}
function browserSpeak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const zh = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('zh'));
    if (zh) u.voice = zh;
    u.lang = zh ? zh.lang : 'zh-CN';
    u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) { console.warn('浏览器 TTS 失败:', e); }
}
/* 手动朗读:消息气泡上加 🔊 */
function addSpeakBtn(msgEl, text) {
  const btn = document.createElement('span');
  btn.textContent = '🔊';
  btn.style.cssText = 'cursor:pointer;font-size:11px;margin-left:6px;opacity:.7;user-select:none';
  btn.title = '朗读这条消息';
  btn.addEventListener('click', e => { e.stopPropagation(); speak(text); });
  msgEl.appendChild(btn);
}

/* ── ASR 语音识别:科大讯飞 RTASR 优先,回退浏览器 Web Speech ── */
let recognizing = false;
function startVoice() {
  if (recognizing) { recognizing = false; hideTip(); return; }
  const btn = document.getElementById('btn-voice');
  if (voiceCfg.asr_provider === 'xunfei') {
    startXunfeiRec();
  } else {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { tip('当前浏览器不支持语音识别,请用 Chrome / Edge'); return; }
    recognizing = true;
    btn.classList.add('rec');
    tip('🎤 正在聆听…', '说完后自动发送');
    const rec = new SR();
    rec.lang = 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = e => {
      const text = e.results[0][0].transcript;
      hideTip(); btn.classList.remove('rec'); recognizing = false;
      document.getElementById('chat-input').value = text; send();
    };
    rec.onerror = e => {
      hideTip(); btn.classList.remove('rec'); recognizing = false;
      if (e.error !== 'aborted') tip('语音识别失败: ' + e.error);
    };
    rec.onend = () => { hideTip(); btn.classList.remove('rec'); recognizing = false; };
    try { rec.start(); } catch (e) { tip('语音启动失败'); }
  }
}
/* 讯飞 RTASR:录音 → 解码 PCM(16k 16bit)→ POST /api/asr */
let xfRecorder = null;
async function startXunfeiRec() {
  const btn = document.getElementById('btn-voice');
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) { tip('浏览器不支持录音'); return; }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    xfRecorder = rec;
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('rec');
      tip('🧠 讯飞识别中…');
      try {
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        const buf = await blob.arrayBuffer();
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const audio = await ctx.decodeAudioData(buf);
        const pcm = audioToPCM16(audio);
        ctx.close();
        const b64 = bufToB64(pcm);
        const res = await fetch('/api/asr', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ audio: b64 }),
        });
        const d = await res.json();
        hideTip();
        if (d.ok && d.text) {
          document.getElementById('chat-input').value = d.text;
          send();
        } else {
          tip('讯飞识别失败: ' + (d.error || '无结果'));
        }
      } catch (e) {
        hideTip(); tip('录音处理失败,请重试');
        console.warn('xunfei asr error:', e);
      }
    };
    recognizing = true;
    btn.classList.add('rec');
    tip('🎤 正在录音…', '点 🎤 或等自然停顿后自动发送');
    rec.start();
    // 30 秒自动停止
    setTimeout(() => { if (xfRecorder && xfRecorder.state === 'recording') xfRecorder.stop(); }, 30000);
  } catch (e) {
    tip('麦克风权限被拒绝或不可用');
    console.warn('mic error:', e);
  }
}
/* 音频 → 16k 16bit PCM(重采样) */
function audioToPCM16(audio, targetRate = 16000) {
  const src = audio.getChannelData(0);
  const ratio = audio.sampleRate / targetRate;
  const outLen = Math.round(src.length / ratio);
  const out = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = Math.min(src.length - 1, Math.round(i * ratio));
    const s = Math.max(-1, Math.min(1, src[idx]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out.buffer;
}
function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function tip(html, sub) {
  const t = document.getElementById('voice-tip');
  t.innerHTML = html + (sub ? `<small>${sub}</small>` : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(hideTip, 8000);
}
function hideTip() {
  const t = document.getElementById('voice-tip');
  t.classList.remove('show');
}
document.getElementById('btn-voice')?.addEventListener('click', startVoice);
document.getElementById('btn-tts')?.addEventListener('click', () => {
  autoTTSOn = !autoTTSOn;
  const btn = document.getElementById('btn-tts');
  btn.classList.toggle('muted', !autoTTSOn);
  btn.title = autoTTSOn ? '自动朗读:开(点关闭)' : '自动朗读:关(点开启)';
});
